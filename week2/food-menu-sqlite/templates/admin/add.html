<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Add Order</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admincss.css') }}">
</head>
<body>

<header class="header">ጣይቱ ምግብ ቤት</header>

<div class="admin-wrap">
    <div class="admin-nav">
        <h2>Admin — Add Order</h2>
        <a class="button-link" href="{{ url_for('admin_orders') }}">← All Orders</a>
    </div>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form class="card" method="POST" action="{{ url_for('admin_add') }}">
        <div>
            <label for="customer">Customer</label>
            <input type="text" id="customer" name="customer" placeholder="Customer name" required>
        </div>

        <div>
            <label for="items">Food items</label>
            <textarea id="items" name="items" rows="3" placeholder="e.g. ዶሮ ወጥ, ቡና" required></textarea>
        </div>

        <div>
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" name="quantity" min="1" step="1" required>
        </div>

        <div>
            <label for="total_price">Total price (birr)</label>
            <input type="number" id="total_price" name="total_price" min="0" step="0.01" required>
        </div>

        <button type="submit" class="submit-btn">Save Order</button>
    </form>
</div>

<footer class="footer">
    <hr style="margin-bottom:10px">
    <p class="footer">@tayitu migib bet. all rights reserved.</p>
</footer>

</body>
</html>
