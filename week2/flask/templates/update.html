{% extends "base.html" %}
{% block title %}Update{% endblock %}

{% block content %}
    <div class= "content">
        <h1>Welcome to the Flask App!</h1> 

        <form action= "/edit/{{task.id}}" method= "post" class= "add-task-form">
            <input type= "text" name= "task" value="{{task.content}}" placeholder= "Enter a new task" required>
            <button type= "submit">Update</button>
        </form>
    </div>
{% endblock %}
