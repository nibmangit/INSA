{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}
    <div class= "content">
        <h1>Welcome to the Flask App!</h1> 

        <table>
            <tr>
                <th> Task </th>
                <th> Added </th>
                <th> Actions </th>
            </tr>

            {% for task in tasks%}
                <tr>
                    <td>{{ task.content}}  </td>
                    <td>{{task.date_created.date()}} </td>
                    <td> 
                        <a href= "/edit/{{task.id}}" class="edit-link" >Edit</a> |
                        <a href= "/delete/{{task.id}}" class="delete-link" >Delete</a>
                    </td>
                </tr>
             {% endfor %}
        </table>

        <form action= "/" method= "post" class= "add-task-form">
            <input type= "text" name= "task" placeholder= "Enter a new task" required>
            <button type= "submit">Add Task</button>
        </form>
    </div>
{% endblock %}
